# APS 7-ID-C (summer 2025, transmission nano-diffraction): a SPEC ASCII file holding
# every scan of a session (#S commands, #L columns, #P positioners, #U_ beamline state)
# with one EPICS areaDetector TIFF per scan point, <specfile>_S<scan:03d>_<point:05d>.tif
# (uint32, 512 x 1028). At the beamline every scan has a folder of its own,
# images/<specfile>/S<scan:03d>/ next to the SPEC file; a copy may put the TIFFs beside it.
name: aps_7id_spec_2025
engine: spec_tiff
description: APS 7-ID SPEC file with one areaDetector TIFF frame per scan point, 2025.

fingerprint:
  text_glob: "*.spec"                # the SPEC file itself, the folder holding it, or a frame below it
  text_tags: ["#F", "#O0", "#S"]     # the tags every SPEC file opens with
  file_names: ["*.spec", "*_S[0-9]*_[0-9]*.tif", "*_S[0-9]*_[0-9]*.tiff"]   # a file given: the session or a frame

layout:
  spec_glob: "*.spec"                           # the SPEC file of a dataset folder
  frame_file: "{prefix}_S{scan:03d}_{point:05d}.tif"   # prefix: the SPEC file's stem
  frame_glob: "{prefix}_S{scan:03d}_*.tif"
  frames_dir:                                   # where the TIFFs are, relative to the SPEC file,
    - "images/{prefix}/S{scan:03d}"             # tried in order: the beamline's folder per scan,
    - "."                                       # then next to the file
  survey_inside:       # the session's folder may hold other datasets (a Python scan's run_<n>.nc
    skip: ["images"]   # folder): the survey looks in its subfolders, but not in its frames

motors:
  # #o mnemonics of the 7-ID-C diffractometer: the file lists them all, this order breaks ties
  known: [phi, th, tth, chi, nsx, nsy, nsz, objh, objv, sdelay, delay, swp, yaw, pitch, radius]
  min_step:   # a change smaller than this between scans is drift, not a step (mm)
    nsx: 0.0002
    nsy: 0.0002
    nsz: 0.0002
  units:
    phi: deg
    th: deg
    tth: deg
    chi: deg
    yaw: deg
    pitch: deg
    nsx: mm
    nsy: mm
    nsz: mm
    objh: mm
    objv: mm

energy:
  header: mono        # the #U_mono block of every scan ...
  field: Energy       # ... whose Energy field is the photon energy in keV

detectors:
  areadetector:       # 7idEiger1, a Dectris EIGER2 Si 500K (the #UXML blocks of the file name it)
    shape: [512, 1028]      # the frame shape when a scan has no TIFF yet
    dtype: uint32
    pixel_size_um: 75.0
    invalid_value: 4294967295   # 2**32 - 1: the EIGER's flag for a dead or masked pixel, read as 0

axis_priority: [sdelay, delay, phi, th, tth, chi, nsx, nsy, nsz]
