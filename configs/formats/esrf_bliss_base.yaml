# Base layout of ESRF BLISS datasets: one master HDF5 per dataset plus per-scan
# folders holding the detector files. Dated specs extend this one.
name: esrf_bliss_base
engine: hdf5_stack
description: ESRF BLISS master file with per-scan detector files (ID03 dark-field microscopy).
abstract: true   # only a base for the dated specs below; sniffing never picks it

fingerprint:
  master_glob: "*.h5"
  master_paths: ["{scan}.1/measurement", "{scan}.1/instrument/positioners"]
  scan_dir_glob: "scan[0-9][0-9][0-9][0-9]"

layout:
  master: "{dataset}/{dataset}.h5"
  scan_folder: "{dataset}/scan{scan:04d}"
  detector_files: "{detector}_*.h5"
  frames: "entry_0000/ESRF-ID03/{detector}/data"
  entry: "{scan}.1"

motors:
  per_frame: "{scan}.1/measurement/{motor}"
  scalar: "{scan}.1/instrument/positioners/{motor}"
  structure: "{scan}.1/instrument/fscan_parameters"
  known: [mu, chi, phi, samz, ffz, ffx, nfx, nfy, nfz, ux, uy, uz, obpitch, ccmth]
  aliases:
    z1: [samz]
  units:
    mu: deg
    chi: deg
    phi: deg
    obpitch: deg
    ccmth: deg
    samz: mm
    ffz: mm
    ffx: mm

energy:
  from: ccmth
  crystal: Si111
  d_spacing_A: 3.1356

detectors:
  pco_ff: {pixel_size_um: 6.5, shape: [2160, 2560]}
  pco_nf: {pixel_size_um: 6.5, shape: [2160, 2560]}

convention: id03
