# LCLS smalldata HDF5 (smalldata_tools): one file per run, one row per event.
# Per-event images are stored only for detectors the producer configured.
name: lcls_smalldata
engine: smalldata
description: LCLS smalldata run file (per-event scalars, optional per-event images, run sums).

fingerprint:
  h5_paths: [lightStatus, event_time]

layout:
  run_file: "*_Run{run:04d}.h5"       # one run in a folder of run files
  # the per-event images of a detector, first found: one ROI is written as
  # <det>/ROI_area, several as <det>/ROI_0_area, <det>/ROI_1_area, ..., the
  # whole detector as <det>/full_area
  frames: ["{detector}/ROI_0_area", "{detector}/ROI_area", "{detector}/full_area"]
  detector_config: "UserDataCfg/{detector}"   # pixelsize (m) and the ROI bounds

keys:
  laser_flag: [lightStatus/laser]
  xray_flag: [lightStatus/xray]
  i0: [ipm4/sum, ipm2/sum, ipm5/sum]
  scanvar: [scan/var0, scan/lxt, scan/delay, scan/lxt_ttc]
  delay: [scan/lxt, scan/lxt_ttc, scan/delay]
  photon_energy: [ebeam/photon_energy, epics/photon_energy]
  event_time: [event_time]
  fiducials: [fiducials]

axis_priority: [delay, scanvar]

# The order is the preference when a run holds several detectors. A file's
# UserDataCfg/<det>/pixelsize wins over these pixel sizes; the glob keys cover
# aliases that change between experiments (epix_1, epix_5, ...).
detectors:
  jungfrau1M: {pixel_size_um: 75.0}
  jungfrau4M: {pixel_size_um: 75.0}
  epix10k2M: {pixel_size_um: 100.0}
  zyla: {pixel_size_um: 6.5}
  "jungfrau*": {pixel_size_um: 75.0}
  "epix10k*": {pixel_size_um: 100.0}
  "epix*": {pixel_size_um: 50.0}       # ePix100a

convention: lcls_xcs
